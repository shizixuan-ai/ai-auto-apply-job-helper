# ============================================================
# Sprint Smoke rules.yaml — MVP（2026-07-10）
# ============================================================
# 目的：定义哪些文件 pattern 改动 → 触发哪些真实验证
#
# 字段说明：
#   pattern       — glob（picomatch），匹配 staged 文件路径
#   required_for  — 精确文件名（不是 glob）。仅这些文件改 → 才强制触发
#                   （避免改了 src/browser/logger.ts 也要跑 probe）
#   triggers[]    — 触发列表
#     id          — 稳定标识（log grep + report 聚合用）
#     command     — 要执行的命令（shell 解析）
#     timeout_sec — 单 Agent 超时
#     reason      — 人类可读解释（report 里显示）
#   skip_when     — shell 命令（exit 0 表示要 skip）。例：
#                   "! curl -s http://localhost:9222/json/version > /dev/null"
#                   CDP 不在时 curl 失败（exit 非 0）→ ! 翻转 → true → skip
#
# 策略（MVP）：
#   - src/browser/index.ts 改 → 强制跑 boss-probe（CDP 缺失时 skip）
#   - src/browser/** 其他文件改 → 不触发（避免 logger.ts 改也跑 60s probe）
#   - 其他目录改 → 不触发真实验证（按 hook 决策）
# ============================================================

rules:
  # 规则 1：Boss 抓取层变更 → 跑真实 BOSS API 探针
  - pattern: "src/browser/**"
    required_for:
      - "src/browser/index.ts"
    skip_when: "! curl -s http://localhost:9222/json/version > /dev/null"
    triggers:
      - id: boss-probe
        command: "npx tsx scripts/probe-boss-api.mjs Java后端"
        timeout_sec: 60
        reason: "BOSS 抓取层变更 — 验证真实 API schema 不漂移（encryptBossId 等关键字段）"

  # 规则 2：飞书表 schema 变更 → 验证必填字段都还在
  - pattern: "src/feishu/**"
    required_for:
      - "src/feishu/index.ts"
    skip_when: "! [ -n \"$FEISHU_APP_TOKEN\" ]"
    triggers:
      - id: feishu-schema-verify
        command: "npx tsx scripts/verify-feishu-schema.mjs"
        timeout_sec: 30
        reason: "飞书表 schema 变更 — 验证 HR_UID/打招呼状态/打招呼时间 必填字段都在"

  # 规则 3：CLI handler 变更 → 端到端 smoke（search --dry-run，不写飞书）
  - pattern: "src/cli/handlers/**"
    required_for:
      - "src/cli/handlers/search-and-write.ts"
      - "src/cli/handlers/sync-handler.ts"
    skip_when: "! curl -s http://localhost:9222/json/version > /dev/null"
    triggers:
      - id: cli-smoke
        command: "npx tsx scripts/cli-smoke.mjs"
        timeout_sec: 90
        reason: "CLI handler 变更 — 验证 search 链路 + 评分 + 端到端参数传递"

  # 规则 4：browser 抓取层变更 → JD 长度硬契约验证（防御懒加载假绿）
  - pattern: "src/browser/**"
    required_for:
      - "src/browser/index.ts"
      - "src/browser/lazy-load-error.ts"
    skip_when: "! curl -s http://localhost:9222/json/version > /dev/null"
    triggers:
      - id: jd-length-verify
        command: "node scripts/verify-jd-length.mjs"
        timeout_sec: 60
        reason: "Sprint 2E：fetchJobDetail 拿到的 JD 必须 ≥ MIN_JD_LENGTH (500)，防御 BOSS 首屏懒加载假绿"